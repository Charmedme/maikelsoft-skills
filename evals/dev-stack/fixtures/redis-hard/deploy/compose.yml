# Production stack of the order service (Docker Swarm). The load balancer spreads requests over the replicas.
services:
  orders-api:
    image: registry.example.com/shop/orders-api:${ORDERS_API_TAG}
    environment:
      ConnectionStrings__Orders: "Host=postgres;Port=5432;Database=orders;Username=orders"
      ConnectionStrings__Cache: "valkey:6379"
    secrets:
      - source: orders-db-password
        target: ConnectionStrings__OrdersPassword
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz/ready"]
      interval: 10s

  valkey:
    image: valkey/valkey:9.1
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  postgres:
    image: postgres:18.6-alpine
    volumes:
      - orders-db:/var/lib/postgresql

volumes:
  orders-db:

secrets:
  orders-db-password:
    external: true
