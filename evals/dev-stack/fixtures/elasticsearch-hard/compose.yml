# Local development stack. Production runs the same versions (PostgreSQL 18.6, Elasticsearch 9.5.5).
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"

  search:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: orders-dev
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
