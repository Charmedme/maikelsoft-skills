<h1>Sign in</h1>
<form (ngSubmit)="submit()">
  <label>Email <input name="email" type="email" autocomplete="username" [(ngModel)]="email" required /></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" [(ngModel)]="password" required /></label>
  @if (error(); as message) {
    <p role="alert">{{ message }}</p>
  }
  <button type="submit" [disabled]="busy()">Sign in</button>
</form>
