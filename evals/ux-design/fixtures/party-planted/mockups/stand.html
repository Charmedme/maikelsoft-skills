<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stand</title>
<link rel="stylesheet" href="../design-system/gameshow/tokens.css">
<link rel="stylesheet" href="../design-system/gameshow/components.css">
<style>
.frame { width: 390px; margin: 0 auto 32px; }
.toestel { min-height: 844px; }
.stapel { position: absolute; top: 70px; right: 24px; width: 90px; height: 120px; background: var(--color-surface-sunken); border-radius: var(--radius-card); transform: rotate(6deg); }
.gs-codebord { position: relative; }
.spelers { list-style: none; margin: 0; padding: 0 var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.spelers button { all: unset; display: flex; gap: 8px; align-items: center; width: 100%; color: var(--color-text); }
.rij { display: flex; gap: var(--space-2); padding: 0 var(--space-4); flex-wrap: wrap; }
.blok { padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
</style></head>
<body>
<section class="frame" data-screen="stand" data-state="default">
<h2>Stand (default)</h2>
<div class="gs-podium toestel">
<header class="gs-showbalk" data-region="top-bar"><button type="button" class="gs-knop gs-knop--stil" data-element="leave-game">Spel verlaten</button>
<h1 class="gs-showbalk__titel">STAND</h1>
<button type="button" class="gs-knop gs-knop--stil" aria-label="Dempen" aria-pressed="true" data-element="sound-toggle" style="padding:8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></svg></button></header>
<main data-region="main"><p class="blok gs-muted">Doelscore 7</p>
<ol class="spelers" style="grid-template-columns:1fr">
<li class="gs-tegel"><button type="button">1. Chantal 5</button></li><li class="gs-tegel"><button type="button">2. Anna 4</button></li>
<li class="gs-tegel"><button type="button">3. Bram 4 <span class="gs-chip">jij</span></button></li><li class="gs-tegel"><button type="button">4. Dewi 2</button></li><li class="gs-tegel"><button type="button">5. Erik 1</button></li>
</ol></main>
<footer class="blok" data-region="bottom-bar"><button type="button" class="gs-knop gs-knop--stil" data-element="music-toggle">Muziek: aan</button>
<button type="button" class="gs-knop">Terug naar het spel</button></footer>
</div></section>
<section class="frame" data-screen="stand" data-state="sound-off">
<h2>Stand (sound-off)</h2>
<div class="gs-podium toestel">
<header class="gs-showbalk" data-region="top-bar"><button type="button" class="gs-knop gs-knop--stil" data-element="leave-game">Spel verlaten</button>
<h1 class="gs-showbalk__titel">STAND</h1>
<button type="button" class="gs-knop gs-knop--stil" aria-label="Dempen opheffen" aria-pressed="false" data-element="sound-toggle" style="padding:8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></button></header>
<main data-region="main"><p class="blok gs-muted">Doelscore 7</p>
<ol class="spelers" style="grid-template-columns:1fr">
<li class="gs-tegel"><button type="button">1. Chantal 5</button></li><li class="gs-tegel"><button type="button">2. Anna 4</button></li>
<li class="gs-tegel"><button type="button">3. Bram 4 <span class="gs-chip">jij</span></button></li><li class="gs-tegel"><button type="button">4. Dewi 2</button></li><li class="gs-tegel"><button type="button">5. Erik 1</button></li>
</ol></main>
<footer class="blok" data-region="bottom-bar"><button type="button" class="gs-knop gs-knop--stil" data-element="music-toggle">Muziek: aan</button>
<button type="button" class="gs-knop">Terug naar het spel</button></footer>
</div></section>
</body></html>
